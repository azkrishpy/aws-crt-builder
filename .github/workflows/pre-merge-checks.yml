# Everything that must be true before a pull request merges, in one workflow.
#
# Consumers call this from a single `pull_request_target` workflow; it replaces
# their per-repo check-abi.yml and block-needs-review.yml.
#
# Ordering has to come from `needs:` inside one run: a label applied with
# GITHUB_TOKEN raises no workflow run, so a separate gate workflow would never
# re-run when the ABI verdict lands, and would read whatever the previous commit
# left behind.
#
# The branch-ruleset entry is the `pre-merge/gate` commit status, not a job name:
# it is posted on every reachable path and is independent of every job name. The
# nested job names ("upkeep / abi-compat" and so on) are what a human reads in
# the merge box. One of them is load-bearing: pre-merge-gate finds the ABI check
# run by its `abi-compat` name suffix.
name: Pre-merge checks

on:
  workflow_call:
    inputs:
      lib-name:
        description: 'C library name for the ABI check, e.g. aws-c-common.'
        required: true
        type: string
      approval-environment:
        description: >-
          Environment whose required reviewers gate execution of PR-authored
          code. The caller passes a name for fork pull requests and '' otherwise;
          '' means no environment and no wait.
        required: false
        type: string
        default: ''
      runs-on:
        required: false
        type: string
        default: 'ubuntu-24.04'
      builder-ref:
        description: 'Ref of aws-crt-builder supplying the actions this workflow runs. A called workflow cannot discover its own ref -- github.job_workflow_sha is empty inside one and workflow_ref describes the caller -- so pin this to match whatever ref the caller pinned the workflow to.'
        required: false
        type: string
        default: 'main'
    secrets:
      CRT_CI_ROLE_ARN:
        required: false

jobs:
  # Holds the deployment environment and nothing else: naming an environment on
  # the credential-minting job would change its OIDC `sub`.
  #
  # This job's `if:` is the only place the "could the code have changed?"
  # predicate is written; abi-compat inherits it through `needs:`.
  approval:
    if: >-
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
      || (github.event.action == 'edited' && github.event.changes.base != null)
    runs-on: ${{ inputs.runs-on }}
    permissions: {}
    # Empty name means no environment and no wait.
    environment: ${{ inputs.approval-environment }}
    steps:
      - name: Approved
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ENVIRONMENT: ${{ inputs.approval-environment }}
        run: |
          # Fail closed. Referencing an environment that does not exist creates
          # it with no protection rules, so a misconfigured caller looks gated
          # in the run graph while running fork code unreviewed. This catches an
          # empty name; that the environment has reviewers is a per-repo
          # prerequisite to verify once, before adoption.
          if [[ "$FORK" == "true" && -z "$ENVIRONMENT" ]]; then
            echo "::error::a fork pull request reached this job with no approval environment; the caller must pass one."
            exit 1
          fi
          echo "PR-authored code is approved to execute in this run."

  abi-compat:
    needs: approval
    runs-on: ${{ inputs.runs-on }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CRT_CI_ROLE_ARN }}
          # Not an input: check-abi hardcodes a us-east-1 ECR registry, and
          # `docker login` would present a token scoped to the wrong region.
          aws-region: us-east-1

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          # head.sha, not head.ref: a bare ref resolves against the base repo,
          # and under pull_request_target the default checkout is the base
          # branch, which would diff main with itself and always say `patch`.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Needed from v4 onward to check out fork PR code under
          # pull_request_target; the approval job is what makes it acceptable.
          # actionlint <= 1.7.12 wrongly calls this input undefined.
          allow-unsafe-pr-checkout: true
          # This tree is bind-mounted into a container that runs PR-authored
          # CMake; leave no usable credential in .git/config.
          persist-credentials: false

      - name: Resolve the commits to compare
        id: refs
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          # Merge base, not the base tip: diffing the tip attributes every
          # commit that landed after this branch forked to this pull request, so
          # the verdict would drift as unrelated pull requests merge.
          BASE_SHA="$(git merge-base HEAD "origin/${BASE_BRANCH}")"
          echo "Comparing ${BASE_SHA} (merge base) -> $(git rev-parse HEAD) (PR head)"
          echo "base-sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check out the actions this workflow runs
        uses: actions/checkout@v4
        with:
          repository: awslabs/aws-crt-builder
          ref: ${{ inputs.builder-ref }}
          path: .crt-builder

      - name: Check ABI
        id: check
        uses: ./.crt-builder/.github/actions/check-abi
        with:
          lib-name: ${{ inputs.lib-name }}
          builder-version: latest
          # Compare exactly these two commits rather than resolving the base ref
          # a second time.
          base-ref: ${{ steps.refs.outputs.base-sha }}

      - name: Apply the verdict label
        uses: ./.crt-builder/.github/actions/abi-label
        with:
          verdict: ${{ steps.check.outputs.label }}
          pr: ${{ github.event.pull_request.number }}

  # The single gate, and the only job reachable on every event -- so the only one
  # whose verdict is safe to require. always(), not !cancelled(): a cancelled run
  # must replace an earlier success rather than leave it standing.
  verdict-gate:
    # approval is in needs so a REJECTED approval fails outright, instead of
    # reaching the skipped-ABI path and being vouched for by an older run.
    needs: [approval, abi-compat]
    if: ${{ always() }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pull-requests: read
      checks: read
      statuses: write
    steps:
      - name: Check out the actions this workflow runs
        uses: actions/checkout@v4
        with:
          repository: awslabs/aws-crt-builder
          ref: ${{ inputs.builder-ref }}
          path: .crt-builder

      - name: Decide and publish the gate status
        uses: ./.crt-builder/.github/actions/pre-merge-gate
        with:
          needs: ${{ toJSON(needs) }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr: ${{ github.event.pull_request.number }}
