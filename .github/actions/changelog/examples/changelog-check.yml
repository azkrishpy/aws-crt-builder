# Example PR check — copy into consumer repo's .github/workflows/
# Fails PR CI if the PR title lacks a `<type>:` prefix or the fragment is missing.

name: Changelog Check
on:
  pull_request:
    # `edited` re-runs this check on PR title edits.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra-only PRs
        id: infra
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Paths considered infra-only for changelog purposes. Tune per repo.
          INFRA_RE='^(\.github/|\.gitignore$|\.gitattributes$|CODEOWNERS$|LICENSE$|NOTICE$|README\.md$|CONTRIBUTING\.md$|docs?/)'
          NON_INFRA=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -vE "$INFRA_RE" || true)
          if [[ -z "$NON_INFRA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR touches only infra paths; changelog check skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Always runs: infra-only PRs waive the fragment, not the title.
      - name: Assert PR title convention and fragment
        uses: awslabs/aws-crt-builder/.github/actions/changelog@main
        with:
          mode: check
          pr: ${{ github.event.pull_request.number }}
          title: ${{ github.event.pull_request.title }}
          require-fragment: ${{ steps.infra.outputs.skip != 'true' }}
