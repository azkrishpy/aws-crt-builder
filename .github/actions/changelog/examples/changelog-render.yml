# Rebuild the `docs` branch from main and add exactly ONE commit that renders
# CHANGELOG.md with the unreleased [Preview] block.
#
#   docs = main's history, verbatim, plus one bot commit on top.
#
# docs is 100% derived, so it is rebuilt from scratch and force-pushed on every
# push to main. There is no merge and no cherry-pick, therefore no conflict can
# occur and no human is ever asked to intervene. Any commit made on docs by
# hand is discarded on the next push to main -- do not commit here.
#
# Main never gets a bot commit: its CHANGELOG.md is written only by the release
# rollup, inside the release commit.

name: Changelog Render
on:
  push:
    branches: [main]
  workflow_dispatch:

# One run per repo. Safe to cancel a superseded run: this workflow renders
# origin/main as fetched INSIDE the run, never the SHA that triggered it, so a
# newer run always produces the same or a newer result. (The old cherry-pick
# model needed cancel-in-progress: false because each run replayed one specific
# commit, so a cancelled run dropped that commit from docs forever.)
concurrency:
  group: changelog-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 1 is enough. The only commit created here has main's tip
      # as its parent, and the remote already has that object.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # changelog.py lives in aws-crt-builder, not in this repo. Pin the ref in
      # production: `main` means a change there reaches this docs branch at once.
      - uses: actions/checkout@v4
        with:
          repository: awslabs/aws-crt-builder
          ref: main
          path: .crt-builder
          persist-credentials: false

      - name: Rebuild docs from main
        env:
          DOCS_BRANCH: docs
          CHANGES_DIR: .changes
          CHANGELOG: CHANGELOG.md
          CHANGELOG_PY: ${{ github.workspace }}/.crt-builder/.github/actions/changelog/scripts/changelog.py
        run: |
          set -euo pipefail

          git config user.name  "aws-crt-bot"
          git config user.email "aws-sdk-common-runtime@amazon.com"

          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main'

          # Not onboarded yet: never invent a CHANGELOG.md or a docs branch.
          # `changelog.py render` happily writes an empty stub when .changes/
          # does not exist, which would fabricate both.
          if ! git cat-file -e "origin/main:${CHANGES_DIR}" 2>/dev/null; then
            echo "no ${CHANGES_DIR}/ on main; nothing to render"
            exit 0
          fi

          for attempt in 1 2 3; do
            git fetch --quiet --force origin \
              "+refs/heads/${DOCS_BRANCH}:refs/remotes/origin/${DOCS_BRANCH}" \
              2>/dev/null || true
            # An EMPTY lease means "must not exist yet" -- the first-run case.
            LEASE="$(git rev-parse --quiet --verify \
                       "refs/remotes/origin/${DOCS_BRANCH}" || true)"

            # Discard whatever docs held. main is the sole source of truth.
            git checkout --quiet -B "${DOCS_BRANCH}" origin/main

            python3 "${CHANGELOG_PY}" render \
              --changes-dir "${CHANGES_DIR}" --changelog "${CHANGELOG}"
            git add -A -- "${CHANGELOG}"

            if git diff --cached --quiet; then
              echo "render matches main byte-for-byte; docs == main"
            else
              git commit --quiet \
                -m "docs: render ${CHANGELOG} including unreleased entries" \
                -m "Derived from ${CHANGES_DIR}/ at $(git rev-parse --short origin/main). Do not edit: this branch is rebuilt from main and force-pushed on every push, so any commit made here is discarded."
            fi

            # --force-with-lease is a compare-and-swap: it refuses if docs moved
            # since the fetch above, so a racing run cannot be clobbered.
            if git push --quiet --force-with-lease="${DOCS_BRANCH}:${LEASE}" \
                 origin "HEAD:refs/heads/${DOCS_BRANCH}"; then
              echo "pushed ${DOCS_BRANCH} on attempt ${attempt}"
              exit 0
            fi

            echo "::warning::${DOCS_BRANCH} moved under us; retrying (${attempt}/3)"
            git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          done

          echo "::error::could not push ${DOCS_BRANCH} after 3 attempts"
          exit 1
